<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html/admin>
        <Files "password.txt">
            Require all denied
        </Files>
    </Directory>
    <Directory /var/www/html/auth>
        <FilesMatch "^(auth|init_db)\.php$">
            Require all denied
        </FilesMatch>
        Options -Indexes
    </Directory>
    <Directory /var/www/html/igate/wifi>
        <Files "wifi.yaml">
            Require all denied
        </Files>
    </Directory>
    # store.php is a library — it defines functions and does nothing when requested,
    # so today it returns an empty 200. Denied anyway, on the same reasoning as
    # auth/auth.php above: a file that is only ever meant to be included should not be
    # reachable by URL, because the day it grows a side effect is not the day anyone
    # thinks to come back and add this.
    <Directory /var/www/html/transcriber>
        <FilesMatch "^store\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/netbird>
        <Files "addresses.yaml">
            Require all denied
        </Files>
        # Include-only library, same reasoning as auth/auth.php and
        # transcriber/store.php above: it defines functions and does nothing when
        # requested, so today it is an empty 200. Denied anyway, because the day it
        # grows a side effect is not the day anyone thinks to come back and add this.
        <Files "yaml_lib.php">
            Require all denied
        </Files>
    </Directory>
    <Directory /var/www/html/tickets>
        <FilesMatch "^(tickets|versions)\.json$">
            Require all denied
        </FilesMatch>

        # Ticket attachments. These were in tickets/.htaccess, which Apache has never
        # read — the web root sets no AllowOverride — so the limit in force was the
        # php.ini default of 2M and any attachment above it failed. A screenshot of the
        # map clears 2M easily, so this had been quietly rejecting the most useful
        # thing anyone attaches to a bug report. mod_php is loaded, so these apply here.
        php_value upload_max_filesize 10M
        php_value post_max_size 52M
    </Directory>

    # Never execute anything out of the attachment directory. The uploader already
    # checks content type with finfo AND extension against an image/PDF whitelist, and
    # rewrites the basename, so nothing executable should reach here in the first
    # place — this is the layer that does not depend on that code staying correct.
    # It was in tickets/uploads/.htaccess and, like the rest, never applied.
    <Directory /var/www/html/tickets/uploads>
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
        Options -Indexes -ExecCGI
        AddType text/plain .php .phtml .phar
    </Directory>
    # Recorded radio audio. The one attachment served straight off disk with no PHP
    # and no auth check, because fifty hands-free phones each fetching every clip of a
    # busy net is on the order of ten thousand mod_php invocations an hour, arriving in
    # bursts because every client polls on a similar cadence. There is no multicast over
    # HTTP; an immutable public URL is the substitute, and lets Cloudflare serve the
    # clip while this Pi serves it roughly once.
    #
    # This is safe here and nowhere else: amateur transmissions are public by law. A
    # photo attached to somebody's message is not, which is why photos stay outside the
    # web root behind ?messaging=photo with Cache-Control: private. Do not "simplify"
    # the two into one path.
    #
    # The filename carries 6 random bytes and Options -Indexes is set, so the URL is a
    # capability obtainable only from the authenticated feed rather than a directory to
    # walk. Nothing is executed here regardless of what ends up in it.
    <Directory /var/www/html/radio>
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
        AddType text/plain .php .phtml .phar
        <FilesMatch "(?i)\.m4a$">
            # Clip contents never change under a given name, so revalidation is pure
            # overhead — this is what keeps the origin out of the fan-out path.
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </Directory>

    <Directory /var/www/html>
        Options -Indexes

        # Radio clips arrive by multipart POST to index.php, which runs at the php.ini
        # defaults (2M/8M) — the web root has never had a block of its own. A capped
        # 120-second over compresses to a few hundred KB, so this is not close, but the
        # 12 MB ceiling in _msg_store_photo() has been dead code for the same reason.
        php_value upload_max_filesize 10M
        php_value post_max_size 52M

        # Include-only libraries, same reasoning as auth/auth.php: they define
        # functions and do nothing when requested, so today each is an empty 200.
        # Denied anyway, because the day one grows a side effect is not the day
        # anyone thinks to come back and add this.
        <FilesMatch "^(spoken_ids|config_parse|messaging_db|config_yaml)\.php$">
            Require all denied
        </FilesMatch>

        # Editor/deploy backups. index.php.bak was a 276 KB copy of the live map
        # source, served with a 200 until 2026-08-08.
        # The trailing group catches dated backups (index.php.bak-20260808), which a
        # plain "\.bak$" anchor misses. It requires a [-.] separator, so ordinary
        # names that merely start with these letters (scoreboard.oldstyle.js) are
        # unaffected.
        <FilesMatch "(?i)\.(bak|old|orig|save|swp|swo)([-.].*)?$|~$">
            Require all denied
        </FilesMatch>

        # Credentials must never be served over HTTP. Every consumer reads these from
        # the filesystem — aprsDaemon.php, index.php, admin/index.php and the analyzer
        # all use __DIR__ paths, and the Pis fetch WiFi through wifi/get.php — so
        # nothing anywhere fetches them by URL.
        #
        # Until 2026-08-12 these were served with a 200 to anyone who asked.
        # mobile_trackers.json carried a token for every tracker, and that token
        # authenticates ?mobile=update, so a position could be injected into APRS-IS
        # under someone else's callsign. wifi/wifi.yaml carried 50 WiFi PSKs. Every
        # event.yaml carried its event_password, messaging_password and sharing pin.
        #
        # A pattern, not a list of paths. The rule this supplements names
        # /var/www/html/igate/wifi/wifi.yaml and was left behind when the WiFi manager
        # moved to /var/www/html/wifi/ — enumerating paths is precisely how a rule like
        # this stops matching without anyone noticing. Matching by extension also covers
        # every event.yaml under events/, which no enumeration ever had.
        <FilesMatch "(?i)\.ya?ml$">
            Require all denied
        </FilesMatch>
        <Files "mobile_trackers.json">
            Require all denied
        </Files>

        # Dependency manifests — they disclose exact package versions and nothing
        # at runtime needs them (composer.json here is require-dev only).
        # Anchored so the PWA's manifest.json is unaffected.
        <FilesMatch "(?i)^(composer|package|package-lock|yarn)\.(json|lock)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # mobile_trackers.json holds a token for every tracker, and that token
    # authenticates ?mobile=update — so anyone reading it could inject a position into
    # APRS-IS under someone else's callsign, as well as read and send their messages.
    #
    # LocationMatch, not Files: this path is a symlink to /run/aprs/, and <Directory>
    # sections are matched against the RESOLVED filesystem path. The target lives
    # outside the web root, so the deny inside <Directory /var/www/html> never applied
    # to it — the rule was present and silently ineffective, while the same rule did
    # work for config.yaml, whose symlink stays inside the root. Location matches the
    # URL and is unaffected by where the file really is.
    #
    # Nothing fetches this by URL: aprsDaemon.php, index.php, admin/index.php and the
    # analyzer all read it from the filesystem, and both the current app and the build
    # on the App Store go through index.php?mobile= and ?messaging= exclusively.
    <LocationMatch "^/(?:.*/)?mobile_trackers\.json$">
        Require all denied
    </LocationMatch>

    # Any path segment starting with a dot: .git, .gitignore, .DS_Store, .claude,
    # and deploy scratch dirs such as server/.staging. LocationMatch (not Files)
    # because these are directories as often as files. .well-known is exempted so
    # ACME/HTTP-01 validation keeps working if TLS ever moves off the Cloudflare
    # tunnel — there is no certbot on this host today, but the exemption is free.
    <LocationMatch "^/(?:.*/)?\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    # Prevent Cloudflare from caching iGate update files
    <LocationMatch "^/igate/.*\.(tar\.gz|sh)$">
        Header set Cache-Control "no-store, no-cache, must-revalidate"
        Header set Pragma "no-cache"
    </LocationMatch>

    # Proxy /analyzer/ to the Flask analyzer app (gunicorn on 127.0.0.1:5001)
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Prefix "/analyzer"
    ProxyPass /analyzer/ http://127.0.0.1:5001/
    ProxyPassReverse /analyzer/ http://127.0.0.1:5001/

    RewriteEngine On
    RewriteRule ^/analyzer$ /analyzer/ [R=301,L]
    RewriteRule ^/tickets/admin$ /tickets/admin.php [L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
