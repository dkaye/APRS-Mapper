name: aprs_map
description: APRS event tracker map for Marin County — online and offline.
publish_to: 'none'
version: 1.13.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geolocator: ^13.0.0
  permission_handler: ^11.0.0
  flutter_map_location_marker: ^9.0.0
  flutter_map_tile_caching: ^9.0.0
  http: ^1.2.0
  gpx: ^2.2.0
  flutter_widget_from_html: ^0.15.0
  path_provider: ^2.1.0
  connectivity_plus: ^6.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
