name: aprs_map
description: APRS event tracker map for Marin County — online and offline.
publish_to: 'none'
version: 1.22.0+34

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.0.0
  latlong2: ^0.9.0
  geolocator: ^14.0.0
  permission_handler: ^11.0.0
  flutter_map_location_marker: ^10.0.0
  flutter_map_tile_caching: ^10.0.0
  http: ^1.2.0
  gpx: ^2.2.0
  flutter_widget_from_html: ^0.15.0
  path_provider: ^2.1.0
  connectivity_plus: ^6.0.0
  url_launcher: ^6.3.0
  flutter_foreground_task: ^9.0.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.0.0
  device_info_plus: ^12.4.0
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^22.0.1
  just_audio: ^0.9.46
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/message.wav
